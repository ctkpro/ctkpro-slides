    pts:['寫程式的 AI，每個動作都問「<b>同意嗎？</b>」','1,053 人，中途<b>偷塞一個危險指令</b>','人攔下 <b>13.6%</b>，自動檢查攔下 <b>89%</b>','越審越鈍：17% → <b>5%</b>','▶ 按 → ×1：右邊折線'],
    story:`<p><b>背景</b>：Claude Code 是 Anthropic 的寫程式 AI，它會直接在你電腦上動手——刪檔案、改設定、上傳程式。所以以前它每做一個動作，就跳一個視窗問你「允許嗎？」，像公文一層一層核章。可是 Anthropic 發現，使用者 <b>97% 都直接按同意</b>。這一關到底有沒有在保護人？</p>
      <p><b>實驗</b>：找來 <b>1,053 位付費的專業測試者</b>，在測試環境裡照常工作。中途，偷偷把其中一個確認視窗<b>換成一個明顯危險的指令</b>（按了也不會真的執行），看誰會按「拒絕」。</p>
      <p><b>結果</b>：1,053 人裡，只有 <b>143 人攔下來，13.6%</b>。同一個危險指令交給「自動檢查」——另一個獨立的 AI，拿著固定的規則逐一審查每個動作，不可逆、會破壞、超出範圍的就擋——<b>擋下 937 次，89%</b>。人放行、機器擋下的有 800 次；機器放行、人擋下的只有 6 次。</p>
      <p><b>越審越鈍</b>（按 → 出右邊折線）：一開始的幾個視窗，人還攔得下約 17%；<b>按過 50 次同意之後，只剩約 5%</b>。機器從頭到尾差不多。</p>
      <p><b>後來</b>：Anthropic 把「自動模式」改成預設——不再每個動作都問人，交給那個獨立的檢查 AI，高風險的才找人。</p>
      <p>收這頁：「不是人不認真。一天按幾十次同意，注意力本來就撐不住。機器攔得住，不是比人聰明，是它<b>拿著事先寫好的清單、不會累</b>。所以人要放在對的位置：不是每一筆都蓋章，是<b>把清單寫在前面</b>——寫清單的，是人。」</p>
      <p class="mu">⚠️ 不要講成「核章沒用」。測試者知道自己在受測，只是不知道測什麼。Anthropic 自己也說：高風險的變更，還是建議人親自看。</p>
      <p class="ask">被問到正式使用的數字：需要人工核准的工作階段，6.3% 出現使用者沒要求的有害動作；自動模式是 2.4%。</p>`,
    src:'Anthropic 官方部落格〈Auto mode is now the default in Claude Code〉，2026-08-07',
    next:'今天唯一一個要記的概念'
  },

    pts:['<b>本場轉折</b>：你們早就有這套制度','交辦單・對帳・會稿','出納不兼會計・簽核留痕','不是從零開始，是<b>把內控延伸到 AI</b>','▶ 按 → ×5：逐列翻'],
    story:`<p>「好消息是：答案卷不是新東西。<b>AI 世界現在流行的驗收做法，你們早就在用了</b>。」逐列翻，每列一句：</p>

    story:`<p>「知道要有答案卷、也知道內控早就有了。那 AI 交回來的東西，<b>收下之前具體怎麼做</b>？先過這五關。」每打一個勾，回扣一個今天講過的故事：</p>

  { // P16
    sec:'3 · 答案卷', time:'16:00 → 18:00',
    pts:['情境：一天 <b>1,000 件</b>補助申請初審','一、二階：人看全部','三階：50 件例外＋<b>隨機抽 20 件</b>','抽查是在<b>量 AI 漏標多少</b>','▶ 可點任一階看說明；按 → ×2：過橋句 → 警語'],
    story:`<p>「說不出起點，就不要部署。」放手要分四階，用同一個情境走一遍（數字是示意）：</p>
      <p><b>第一階 影子模式</b>：人照常審全部 1,000 件，AI 在旁邊也審一份、不送出，比兩份差在哪。<b>第二階 逐項審核</b>：AI 先出 1,000 份草稿，人逐件看。<b>第三階 例外＋抽樣</b>：AI 審完，自己標出 50 件「我不確定」，人看這 50 件；剩下 950 件它說沒問題的，人<b>隨機抽 20 件</b>。<b>第四階 只看高風險</b>：例外也交給 AI，人只看 5 件高金額、高後果的。</p>
      <p>第三階的抽查，<b>不是在查那 20 件，是在量 AI 說「沒問題」的那堆裡藏了多少錯</b>——跟會計師查帳一樣，不逐筆看，但一定要抽。按出過橋句：<b>抽出來的錯夠少，才能走到第四階</b>。</p>
      <p>再按出警語：第四階最大的風險，是 <b>AI 很有把握、所以沒標出來、但其實是錯的</b>——就是開場那種錯得很專業。所以抽樣要一直留著，因為模型會改版、案件會變、人會越看越鬆。</p>
      <p>收這頁：「說得出你們現在在第幾階、憑什麼數據往上走，才能部署。」</p>`,

  { // P17
    sec:'4 · 有答案卷的交給 AI', time:'18:00 → 19:00',
    pts:['程式最先被接走：<b>要嘛能跑、要嘛不能</b>','公司會先交出<b>規則清楚、可以被檢查</b>的工作','你們的：<b>法條・加總・單據日期</b>都對得到','▶ 按 → ×1：扣回你們的工作'],
    story:`<p>「反過來看：AI 最先接走的，是什麼工作？」</p>
      <p>經濟學家 Acemoglu 說，寫程式最先被 AI 接走，是因為程式「<b>要嘛能跑、要嘛不能跑</b>」——寫完一跑就知道對不對，<b>天生就有答案卷</b>。比爾・蓋茲也說，公司會先把「<b>規則清楚、可以被檢查</b>」的工作交給 AI。</p>
      <p>按 →，扣回台下的工作：「放到你們的工作裡，哪些是這種？<b>函文引的法條條號對不對、統計表加總對不對、核銷單據日期有沒有在計畫期間內</b>——這些都對得到答案，就是最先可以交出去的。」</p>
      <p>可以問台下一句：「你手上哪一件工作，<b>做完一對就知道對不對</b>？」讓大家想五秒，不用回答。</p>
      <p>收這頁：「<b>越能被檢查的工作，越早交給 AI</b>。接下來看兩個政府部門已經這樣分工的例子。」</p>
      <p class="mu">⚠️ Acemoglu、蓋茲講成「他說」，是影片轉述，不講成研究結論。蓋茲提到他最擔心初階與中階職位——這裡不講，留給第 19 頁「工作換形狀」。</p>`,

  { // P18
    sec:'4 · 有答案卷的交給 AI', time:'19:00 → 19:40',
    pts:['<b>行之有年</b>的工作模式','颶風往哪走：<b>有標準答案</b>，交給 AI','要不要發警報、發給誰：<b>判斷</b>，留給預報員','▶ 按 → ×1：留給人的那張卡'],
    story:`<p>「跟 AI 合作，其實不是新東西。這是一種<b>已經行之有年</b>的工作模式。」</p>
      <p>氣象預報幾十年來都是這樣分工：<b>電腦模式算颶風路徑，預報員看完，決定發不發警報</b>。現在只是把電腦模式換成 AI。</p>
      <p><b>左邊，交給 AI</b>：颶風會往哪裡走，這是<b>有標準答案</b>的工作——颶風走到哪，事後一定對得起來。所以 AI 有足夠的資料和證據把路徑預測出來、交出答案。Google DeepMind 的 AI 天氣模型和美國國家颶風中心的預報員合寫論文，評估 200 多個熱帶氣旋，<b>平均多給約一天的準備時間</b>。</p>
      <p>按 →，<b>右邊，留給人</b>：可是「<b>要不要發警報？發給誰知道？</b>」——這沒有標準答案。發早了，大家白撤離一趟；發晚了，可能出人命。這是判斷，<b>最後還是預報員決定</b>。模型只是他們的輸入之一。</p>
      <p>收這頁：「<b>AI 給預測，人發警報</b>。有答案卷的交給 AI，沒有答案卷的，留給人。這個分工，後面會再用一次。」（埋第 22 頁「判斷」。）</p>
      <p class="mu">不講颶風名字和年份（素材裡的名稱待核）。「多一天」是 DeepMind 研究員自己的說法。</p>`,
    src:'Google DeepMind 研究員 2026-10-15 公開貼文（自家說法）',
    next:'勞動部公開分享過的四個實例'
  },

    pts:['四個實例：媒合・個管・財管・工程督導','先看<b>藍色：AI 做的步驟</b>','▶ 按 → ×1：<b>紅色「人」的步驟</b>一起亮','確認的那一步，<b>四個都留給了人</b>','▶ 按 → ×1：收尾句'],
    story:`<p class="mu">⚠️ 出處只用口頭講，畫面不寫。上台前確認當天是不是丁玉珍司長：是 → 「這四個例子，是司長 8 月底在數位政府高峰會公開分享的」；不是 → 「勞動部在數位政府高峰會分享過」。<b>只講事實，不稱讚。</b></p>

      <p><b>就業個案管理</b>：個管員七成時間花在行政。AI 整理會談紀錄、擬處遇建議草稿，單案行政從 20 分鐘到 5 分鐘；<b>由個管員依個案實際情況確認</b>。</p>
      <p><b>財產管理</b>：先把 15 套系統整合成 1 套，還沒用 AI 盤點就從 3 個月變 2 個月；下一步的智能標籤只給候選分類，<b>由財管人員確認才登帳</b>。</p>

  { // P20

    pts:['工作沒有消失，<b>是換了形狀</b>','初階新進 <b>少了三分之二</b>，管 AI 的工作 <b>翻倍</b>','AI 幫最多的，是<b>經驗少的人</b>','▶ 按 → ×1：也就是今天講的答案卷'],
    story:`<p>「AI 年代下，人的定位在哪裡？」一句話：<b>AI 沒讓工作消失，是把工作往「管 AI、驗 AI」推。</b></p>
      <p><b>左圖</b>：Anthropic 公布自己公司內部的數據——技術部門新招的人裡，初階的比例從 27% 掉到 9%；員工工作裡，寫指令、檢查產出這類「管 AI」的工作，從 10% 漲到 22%。<b>自己做的變少，管 AI 的變多</b>——就是前面講的「往上退一格」。</p>

      <p class="mu">⚠️ 不說「省人」。一定要講：報告自己提醒，AI 公司的數字不能直接套到一般機關。</p>
      <p class="ask">口頭選配（看現場反應）：初階職缺變少，但 AI 最幫新手——那新人要在哪裡練出判斷力？對勞動政策很對題，但會把場子帶向人才政策。</p>`,

const stage=document.getElementById('stage');
stage.innerHTML = Array.from({length:TOTAL},(_,i)=>{
  const p=PAGES[i];
  const li=x=>x.startsWith('▶')?`<li class="stage"><span>${x.slice(1).trim()}</span></li>`:`<li><span>${x}</span></li>`;
  return `<section class="page">
    <div class="top"><span class="no">${i+1} <small>/ ${TOTAL}</small></span><span class="sec">${p.sec}</span>${p.cp?`<span class="cp">${p.cp}</span>`:''}<span class="time">⏱ ${p.time}</span></div>
    <div class="left"><h2>本頁重點</h2>
      <ol class="pts">${p.pts.map(li).join('')}</ol>
      <div class="preview"><span class="lbl">聽眾畫面</span><iframe data-n="${i+1}" title="聽眾畫面"></iframe></div>
      <p class="next">下一頁 → <b>${p.next}</b></p></div>
    <div class="right">
      <div class="detail"><p class="dh">完整故事</p>${p.story}${p.src?`<p class="src">出處：${p.src}</p>`:''}</div></div></section>`;
}).join('');

const pages=[...document.querySelectorAll('.page')];
let cur=0;
function show(i){
  cur=Math.max(0,Math.min(TOTAL-1,i));
  pages.forEach((s,k)=>s.classList.toggle('active',k===cur));
  // 只載入目前這頁的聽眾畫面（查詢參數強制重新載入，hash 指定頁碼）
  const f=pages[cur].querySelector('iframe');
  const want=`${DECK}?p=${cur+1}#${cur+1}`;
  if(f && f.getAttribute('src')!==want) f.setAttribute('src',want);
  fitPage(pages[cur]);
  document.getElementById('progress').style.width=(cur/(TOTAL-1))*100+'%';
  history.replaceState(null,'','#'+(cur+1));
}
// 放不下就縮字：左邊重點不能壓到聽眾畫面，右邊故事不能超出底部
function fitPage(pg){
  const pts=pg.querySelector('.pts'), pv=pg.querySelector('.preview'), d=pg.querySelector('.detail');
  if(pts&&pv){ let f=29;
    pts.querySelectorAll('li').forEach(li=>li.style.fontSize='');
    const gap=()=>pv.getBoundingClientRect().top-pts.getBoundingClientRect().bottom;
    const sc=stage.getBoundingClientRect().width/1280;
    while(gap()<16*sc && f>18){ f-=1; pts.querySelectorAll('li').forEach(li=>li.style.fontSize=(li.classList.contains('stage')?f-5:f)+'px'); } }
  if(d){ let f=18; d.style.fontSize=f+'px';
    while(d.scrollHeight>d.clientHeight+1 && f>13){ f-=0.5; d.style.fontSize=f+'px'; } }
}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',()=>{fit();fitPage(pages[cur]);});
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){show(cur+1);e.preventDefault();}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){show(cur-1);e.preventDefault();}
  if(e.key==='Home')show(0); if(e.key==='End')show(TOTAL-1);
});
document.getElementById('prevBtn').onclick=()=>show(cur-1);
document.getElementById('nextBtn').onclick=()=>show(cur+1);
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)dx<0?show(cur+1):show(cur-1);},{passive:true});
const h=parseInt(location.hash.slice(1),10);
fit(); show(h>=1&&h<=TOTAL?h-1:0);
</script>
